name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Find Project
        run: |
          ls -la
          echo "--- Zip content ---"
          unzip -l newBilal.zip
          unzip -o newBilal.zip
          echo "--- After unzip ---"
          ls -la
          find . -name "gradlew" -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        run: |
          GRADLE_FILE=$(find . -name "gradlew" -type f | head -n 1)
          echo "Gradle at $GRADLE_FILE"
          chmod +x $GRADLE_FILE
          DIR=$(dirname $GRADLE_FILE)
          cd $DIR
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilal-APK-6194905
          path: '**/build/outputs/apk/release/*.apk'
