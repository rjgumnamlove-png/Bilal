name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List files
        run: ls -la
        
      - name: Unzip project
        run: |
          unzip -o newBilal.zip -d project_temp
          mv project_temp/*/* . 2>/dev/null || mv project_temp/* . 2>/dev/null || cp -r project_temp/* . 2>/dev/null
          ls -la
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilal-APK-6194905
          path: app/build/outputs/apk/release/*.apk
