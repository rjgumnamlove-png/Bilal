name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o newBilal.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Release APK
        run: |
          DIR=$(find . -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Found at $DIR"
          cd $DIR
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilal-APK-6194905
          path: '**/build/outputs/apk/release/*.apk'
